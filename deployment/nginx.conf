server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /embed {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://x.com https://*.x.com https://twitter.com https://*.twitter.com https://alirezaafshan.com https://portfolio.alirezaafshan.com" always;
    }
    location = /embed/ { absolute_redirect off; return 308 /embed$is_args$args; }
    location = /embed/index.html { absolute_redirect off; return 308 /embed$is_args$args; }

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /build.json =503;
    }
    location = /build.json {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
